name: profile images

on:
  schedule:
    # Every day at 06:00 UTC, so the board is never far behind.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# A scheduled run and a push run both write the output branch; let one finish.
concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The snake, its board and its palette are snk's own, on its stock
      # github-dark preset with no colours of ours. It lands outside dist/ so
      # only the finished composite is published.
      - name: the snake, by Platane/snk
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: raw/snake.svg?palette=github-dark

      # Splices our tetris opening into snk's loop and wraps it in our chrome.
      - name: the cabinet
        run: node scripts/contributions.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: calendar json, for the portfolio to read
        run: node scripts/calendar-json.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
